name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 只有 SPA 源码或工作流本身变化时才重新构建，笔记数据在独立仓库，不会触发本仓库构建
    paths:
      - 'notes-manager/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 允许 GITHUB_TOKEN 部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，新任务会取消正在进行的任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: notes-manager/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: notes-manager

      - name: Build (Vite)
        run: npm run build
        working-directory: notes-manager

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: notes-manager/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
